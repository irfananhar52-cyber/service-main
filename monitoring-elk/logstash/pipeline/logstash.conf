# ============================================================
# Logstash Pipeline – Microservices Log Processing
# Services: auth-service-main, order-main, email-main, product-main
# ============================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

# ============================================================
# FILTER SECTION
# ============================================================
filter {

  # ── Tag service berdasarkan nama container ──────────────────
  if [container][name] =~ /auth-service-main/ or [docker][container][name] =~ /auth-service-main/ {
    mutate { add_field => { "service_name" => "auth-service-main" } }
  } else if [container][name] =~ /order-main/ or [docker][container][name] =~ /order-main/ {
    mutate { add_field => { "service_name" => "order-main" } }
  } else if [container][name] =~ /email-main/ or [docker][container][name] =~ /email-main/ {
    mutate { add_field => { "service_name" => "email-main" } }
  } else if [container][name] =~ /product-main/ or [docker][container][name] =~ /product-main/ {
    mutate { add_field => { "service_name" => "product-main" } }
  } else {
    mutate { add_field => { "service_name" => "unknown" } }
  }

  # ── Bersihkan ANSI color codes dari log ─────────────────────
  mutate {
    gsub => [ "message", "\x1B\[[0-9;]*[mGKHF]", "" ]
  }

  # ── Parse JSON log (Spring Boot dengan JSON logging) ─────────
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "spring"
      remove_field => ["message"]
    }
    if [spring][message] {
      mutate { add_field => { "log_message" => "%{[spring][message]}" } }
    }
    if [spring][level] {
      mutate { add_field => { "log_level" => "%{[spring][level]}" } }
    }
    if [spring][logger_name] {
      mutate { add_field => { "logger" => "%{[spring][logger_name]}" } }
    }
    if [spring][thread_name] {
      mutate { add_field => { "thread" => "%{[spring][thread_name]}" } }
    }
    if [spring][stack_trace] {
      mutate { add_field => { "stack_trace" => "%{[spring][stack_trace]}" } }
    }
    if [spring][@timestamp] {
      date {
        match   => [ "[spring][@timestamp]", "ISO8601" ]
        target  => "@timestamp"
      }
    }
  } else {
    # ── Parse plain text Spring Boot log ─────────────────────────
    # Format: 2024-01-15 10:30:00.123  INFO 1234 --- [   main] com.example.App : message
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:thread}\]\s+%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}",
          "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+\[%{DATA:thread}\]\s+%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}",
          "%{GREEDYDATA:log_message}"
        ]
      }
    }
    if [log_timestamp] {
      date {
        match   => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss.SSS", "ISO8601" ]
        target  => "@timestamp"
        remove_field => ["log_timestamp"]
      }
    }
  }

  # ── Klasifikasikan level severity ───────────────────────────
  if [log_level] {
    mutate {
      uppercase => [ "log_level" ]
    }
    if [log_level] in ["ERROR", "FATAL"] {
      mutate { add_field => { "severity" => "high" } }
    } else if [log_level] == "WARN" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }

  # ── Bersihkan field tidak perlu ──────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "tags", "log", "host"]
  }
}

# ============================================================
# OUTPUT SECTION
# ============================================================
output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    # Index terpisah per service per hari
    index    => "microservices-%{service_name}-%{+YYYY.MM.dd}"
    action   => "index"
  }

  # Uncomment untuk debug:
  # stdout { codec => rubydebug }
}
