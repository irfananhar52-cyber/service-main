spring.application.name=product
# spring.datasource.url=jdbc:mysql://localhost:3306/productdb
# spring.datasource.username=spring
# spring.datasource.password=123456
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productdb}
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Enable ELK shipping by running with SPRING_PROFILES_ACTIVE=elk
logging.structured.format.console=logstash
app.logging.logstash.host=${LOGSTASH_HOST:localhost}
app.logging.logstash.port=${LOGSTASH_PORT:5000}